<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Espresso Full-Grain Leather Belt">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F3EFE7" stop-opacity="1"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#26352F" flood-opacity="0.11"/>
    </filter>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 H8 M4 0 V8" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#F3EFE7"/>
  <rect width="800" height="800" fill="url(#studioGlow)"/>
  <ellipse cx="400" cy="685" rx="210" ry="22" fill="#26352F" fill-opacity="0.07"/>
  
    <g filter="url(#softShadow)">
      <circle cx="410" cy="400" r="195" fill="none" stroke="#5A3E2B" stroke-width="64"/>
      <circle cx="410" cy="400" r="165" fill="none" stroke="#472F1F" stroke-width="8"/>
      <!-- Tongue end -->
      <path d="M410 564 L640 564 C658 564 672 578 672 596 C672 614 658 628 640 628 L410 628 Z" fill="#5A3E2B"/>
      <!-- Punch holes -->
      <circle cx="535" cy="596" r="4" fill="#2A1B10"/>
      <circle cx="565" cy="596" r="4" fill="#2A1B10"/>
      <circle cx="595" cy="596" r="4" fill="#2A1B10"/>
      <circle cx="625" cy="596" r="4" fill="#2A1B10"/>
      <!-- Brushed brass buckle -->
      <rect x="195" y="346" width="76" height="108" rx="14" fill="none" stroke="#C2A368" stroke-width="14"/>
      <line x1="233" y1="399" x2="275" y2="399" stroke="#C2A368" stroke-width="8" stroke-linecap="round"/>
      <!-- Topstitch -->
      <circle cx="410" cy="400" r="219" fill="none" stroke="#7A573E" stroke-width="2" stroke-dasharray="6 4"/>
    </g>
</svg>