<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Sage Organic Cotton Hoodie">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F3EFE7" stop-opacity="1"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#26352F" flood-opacity="0.11"/>
    </filter>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 H8 M4 0 V8" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#F3EFE7"/>
  <rect width="800" height="800" fill="url(#studioGlow)"/>
  <ellipse cx="400" cy="685" rx="210" ry="22" fill="#26352F" fill-opacity="0.07"/>
  
    <g filter="url(#softShadow)">
      <!-- Sleeves -->
      <path d="M240 215 L125 365 L175 405 L265 295 Z" fill="#6F8474" stroke="#536858" stroke-width="2"/>
      <path d="M560 215 L675 365 L625 405 L535 295 Z" fill="#6F8474" stroke="#536858" stroke-width="2"/>
      <!-- Cuffs -->
      <path d="M122 362 L173 402 L158 422 L107 382 Z" fill="#5D7262"/>
      <path d="M678 362 L627 402 L642 422 L693 382 Z" fill="#5D7262"/>
      <!-- Body -->
      <path d="M250 195 L550 195 L565 620 C565 632 555 640 542 640 L258 640 C245 640 235 632 235 620 Z" fill="#778C7C"/>
      <path d="M250 195 L550 195 L565 620 C565 632 555 640 542 640 L258 640 C245 640 235 632 235 620 Z" fill="url(#weave)"/>
      <!-- Hem ribbing -->
      <rect x="235" y="592" width="330" height="48" rx="6" fill="#647869"/>
      <!-- Hood -->
      <path d="M300 195 C295 110 345 85 400 85 C455 85 505 110 500 195 C470 235 330 235 300 195 Z" fill="#6A7F6F" stroke="#536858" stroke-width="2"/>
      <path d="M335 190 C338 140 365 122 400 122 C435 122 462 140 465 190 C440 212 360 212 335 190 Z" fill="#4A5D4F"/>
      <!-- Drawstrings -->
      <path d="M376 206 L372 308" stroke="#EFECE4" stroke-width="5" stroke-linecap="round"/>
      <path d="M424 206 L428 308" stroke="#EFECE4" stroke-width="5" stroke-linecap="round"/>
      <!-- Kangaroo pocket -->
      <path d="M295 445 L505 445 L525 562 L275 562 Z" fill="#6E8373" stroke="#566B5B" stroke-width="2" stroke-dasharray="5 3"/>
    </g>
</svg>