<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Everyday Cream Canvas Sneakers">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F3EFE7" stop-opacity="1"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#26352F" flood-opacity="0.11"/>
    </filter>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 H8 M4 0 V8" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#F3EFE7"/>
  <rect width="800" height="800" fill="url(#studioGlow)"/>
  <ellipse cx="400" cy="685" rx="210" ry="22" fill="#26352F" fill-opacity="0.07"/>
  
    <g filter="url(#softShadow)">
      <!-- Back sneaker -->
      <g transform="translate(-45, -60) scale(0.92)">
        <path d="M180 490 C180 420 260 390 330 375 L430 330 C465 345 520 355 565 385 C615 415 655 445 655 495 L180 495 Z" fill="#EAE5DB" stroke="#CFC7B8" stroke-width="2"/>
        <rect x="175" y="488" width="485" height="44" rx="14" fill="#C9AA83" stroke="#AD8D67" stroke-width="2"/>
      </g>
      <!-- Foreground sneaker -->
      <path d="M145 505 C145 435 230 395 315 380 L415 330 C455 352 515 368 575 402 C630 432 665 460 665 510 L145 510 Z" fill="#F4F0E8" stroke="#D2C9BA" stroke-width="2.5"/>
      <!-- Toe cap & laces -->
      <path d="M560 442 C618 450 660 474 662 510 L540 510 Z" fill="#E8E2D6"/>
      <line x1="400" y1="365" x2="465" y2="395" stroke="#DFD8CA" stroke-width="7" stroke-linecap="round"/>
      <line x1="430" y1="382" x2="495" y2="412" stroke="#DFD8CA" stroke-width="7" stroke-linecap="round"/>
      <line x1="460" y1="400" x2="525" y2="430" stroke="#DFD8CA" stroke-width="7" stroke-linecap="round"/>
      <!-- Gum rubber sole -->
      <rect x="140" y="505" width="530" height="48" rx="16" fill="#C7A67E" stroke="#A6855E" stroke-width="2"/>
      <line x1="150" y1="528" x2="660" y2="528" stroke="#B49269" stroke-width="2"/>
    </g>
</svg>